<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f7f2" />
    <title>Tender · Offline</title>
    <style>
      body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#f7f7f2;color:#27332d;font:16px system-ui,sans-serif}
      main{max-width:420px;padding:28px;border:1px solid #e3e8e2;border-radius:16px;background:#fff}
      h1{font-size:24px;margin:0 0 10px}p{line-height:1.55;color:#69766d;margin:0 0 18px}
      button{border:0;border-radius:8px;padding:12px 16px;background:#20211f;color:white;font:inherit;font-weight:600}
    </style>
  </head>
  <body><main><img src="/icon.svg" width="48" height="48" alt="Tender" style="margin-bottom:24px"/><h1>You’re offline</h1><p>Tender needs an internet connection to load products, check orders, and make payments. Reconnect and try again.</p><button onclick="location.reload()">Try again</button></main></body>
</html>
